[package]
name = "mantagli"
version = "0.1.0"
description = "Mantagli - AI-directed 3D montage studio"
edition = "2021"

[lib]
name = "mantagli_lib"
# cdylib is only for mobile targets; on windows-gnu it exceeds the DLL export-ordinal limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
